[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projection-center-searching"
version = "0.1.0"
description = "OpenCL-accelerated projection center searching and projection resampling for cone-beam CT datasets stored in HDF5."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Tanya Thakur" },
  { name = "Miloš Đurić" }
]
dependencies = [
  "numpy>=1.26",
  "h5py>=3.10",
  "pyopencl>=2024.1",
  "mako>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
projection-center = "projection_center_searching.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
